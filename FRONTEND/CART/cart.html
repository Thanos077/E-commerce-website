<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart |🛍️ ShopHub - Online Shopping WebsitE</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="cart.css">
</head>

<body>

    <!-- Header -->
    <header class="cart-header">
        <div class="container d-flex justify-content-between align-items-center">

            <a href="../HOME_PAGE/home.html" class="brand">
                <i class="bi bi-bag-heart-fill"></i>
                ShopHub
            </a>

            <a href="../HOME_PAGE/home.html" class="continue-shopping">
                <i class="bi bi-arrow-left"></i>
                Continue Shopping
            </a>

        </div>
    </header>


    <!-- Main Cart Section -->
    <main class="container my-5">

        <h2 class="cart-title">
            <i class="bi bi-cart3"></i>
            My Shopping Cart
        </h2>

        <p id="user-message">Your selected products will appear here.</p>

        <div class="row g-4">

            <!-- Cart Products -->
            <div class="col-lg-8">

                <div class="cart-box">

                    <div id="cart-items">

                        <!-- Products will be displayed here using JavaScript -->

                    </div>

                    <div id="empty-cart" class="empty-cart">

                        <i class="bi bi-cart-x"></i>

                        <h4>Your cart is empty!</h4>

                        <p>Looks like you haven't added anything yet.</p>

                        <a href="../HOME_PAGE/home.html" class="btn btn-primary">
                            Start Shopping
                        </a>

                    </div>

                </div>

            </div>


            <!-- Order Summary -->
            <div class="col-lg-4">

                <div class="summary-box">

                    <h4>Order Summary</h4>

                    <hr>

                    <div class="summary-row">
                        <span>Total Items</span>
                        <span id="total-items">0</span>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₹<span id="subtotal">0.00</span></span>
                    </div>

                    <div class="summary-row">
                        <span>Delivery</span>
                        <span id="delivery">Free</span>
                    </div>

                    <hr>

                    <div class="summary-row total-row">
                        <strong>Total Amount</strong>
                        <strong>₹<span id="grand-total">0.00</span></strong>
                    </div>

                    <button id="checkout-btn" class="btn btn-primary w-100 mt-4">
                        Proceed to Checkout
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script type="module" src="cart.js"></script>

</body>

</html>
