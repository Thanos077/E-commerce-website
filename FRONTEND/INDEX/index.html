<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ ShopHub -SIGN IN PAGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <form class="card shadow p-4 signup-box" id="myform">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="name" class="form-label">NAME</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name">
                    <small id="nameError" class="error text-danger"></small>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">E-MAIL</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email">
                    <small id="emailError" class="error text-danger"></small>
                </div>

            </div>


            <div class="row g-3 mt-1">

                <div class="col-md-6">
                    <label for="age" class="form-label">AGE</label>
                    <input type="number" id="age" class="form-control" placeholder="Enter your age">
                    <small id="ageError" class="error text-danger"></small>
                </div>

                <div class="col-md-6">
                    <label for="gender" class="form-label">GENDER</label>

                    <select name="gender" id="gender" class="form-select">
                        <option value="" selected disabled>Choose gender</option>
                        <option value="male">MALE</option>
                        <option value="female">FEMALE</option>
                        <option value="others">OTHERS</option>
                    </select>
                    <small id="genderError" class="error text-danger"></small>
                </div>

            </div>


            <div class="row g-3 mt-1">

                <div class="col-md-6">
                    <label for="password" class="form-label">ENTER PASSWORD</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password">
                    <small id="passwordError" class="error text-danger"></small>
                </div>

                <div class="col-md-6">
                    <label for="re-pass" class="form-label">ENTER PASSWORD AGAIN</label>
                    <input type="password" id="re-pass" class="form-control" placeholder="Enter your password again">
                    <small id="confirmPasswordError" class="error text-danger"></small>

                </div>

            </div>
            <div class="row g-3 mt-1">

                <div class="col-lg-6">
                    <button type="reset" class="btn btn-warning w-100">
                        RESET
                    </button>
                </div>

                <div class="col-lg-6">
                    <button type="submit" class="btn btn-primary w-100">
                        SUBMIT
                    </button>
                </div>

            </div>
            <div class="row g-3 mt-1">
                <p>
                    <span style="font-weight: 700;">ALREADY HAVE AN ACCOUNT?
                    <a href="login.html">LOGIN</a>
                    </span>
                </p>
            </div>

        </form>

    </div>
    <script type="module" src="index.js"></script>
</body>

</html>
